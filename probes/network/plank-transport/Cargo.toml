[package]
name = "plank-probe-plank_transport"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[features]
default = ["quinn-bbr"]
quinn-bbr = [
    "quinn-proto/plank-bbr-default",
    "plank-transport/quinn-bbr",
]

[dependencies]
anyhow = "1.0"
bytes = "1.10"
hex = "0.4"
kynet = { path = "../../../third_party/kyber-kymux/kynet", features = ["kynet-quinn"] }
quinn-proto = { version = "=0.11.19", default-features = false }
plank-transport = { path = "../../../protocol/plank-transport", default-features = false }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[patch.crates-io]
# Share production Quinn and PLANK telemetry; see the vendored PLANK-PATCH.md.
quinn-proto = { path = "../../../third_party/quinn-proto-0.11.19" }
