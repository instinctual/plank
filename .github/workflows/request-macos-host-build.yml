name: Request approved macOS Host build

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: approved-macos-host-build-requests
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.repository == 'instinctual/plank' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/build-macos-host' &&
      (github.event.sender.id == 65196962 || github.event.sender.id == 625982)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      # issue_comment selects the default branch, never the PR's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          sparse-checkout: |
            scripts/ci/request-macos-host-build.py
            .github/macos-host-test-approvals.json
          sparse-checkout-cone-mode: false
      - name: Validate request and dispatch the approved revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/request-macos-host-build.py
