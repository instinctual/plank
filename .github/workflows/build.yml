name: Hosted builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      product:
        description: Product to rebuild (all on ordinary push/PR)
        type: choice
        default: all
        options: [all, linux-host, linux-client, macos-host, macos-client, macos-fullscreen-probe]
      source_sha:
        description: Expected commit (optional in UI; required by the dispatch helper)
        type: string
      signed:
        description: Request protected macOS signing (allowed branches only)
        type: boolean
        default: false
      clean_bootstrap:
        description: Bypass dependency cache restore and save
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hosted-builds-${{ github.ref }}-${{ inputs.product || 'all' }}
  cancel-in-progress: true

env:
  BUILD_REF: ${{ github.head_ref || github.ref_name }}
  PYTHONDONTWRITEBYTECODE: '1'
  EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  policy:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install source-gate test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - run: python3 -m unittest discover -s tests/ci -v
      - name: Require the intended source revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

  linux-host:
    if: ${{ !inputs.product || inputs.product == 'all' || inputs.product == 'linux-host' }}
    needs: policy
    runs-on: ubuntu-24.04
    container: rockylinux/rockylinux:9.7@sha256:53f4c6dcb34e1403bd93207351f0af9a593610faeb7165cb8a037346765199b0
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      PLANK_BUILD_JOBS: '4'
    steps:
      - name: Prepare checkout tools
        run: |
          # Pin repositories before the first transaction, not after checkout.
          dnf --disablerepo='*' \
            --repofrompath=ci-baseos,https://dl.rockylinux.org/vault/rocky/9.7/BaseOS/x86_64/os/ \
            --repofrompath=ci-appstream,https://dl.rockylinux.org/vault/rocky/9.7/AppStream/x86_64/os/ \
            --enablerepo=ci-baseos --enablerepo=ci-appstream \
            install -y git tar gzip python3 dnf-plugins-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/ci/context.py
      - run: bash scripts/ci/install-linux-deps.sh host
      - name: Restore and verify dependencies
        if: ${{ !inputs.clean_bootstrap }}
        uses: ./.github/actions/dependency-cache
        with:
          operation: restore
          product: linux-host
      - run: bash scripts/ci/bootstrap.sh linux-host
      - name: Save dependencies
        if: ${{ !inputs.clean_bootstrap && github.event_name != 'pull_request' }}
        uses: ./.github/actions/dependency-cache
        with:
          operation: save
          product: linux-host
      - run: bash scripts/ci/build.sh linux-host
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PLANK_ARTIFACT_ROOT }}/
          if-no-files-found: error
          retention-days: 7
      - name: Report disk usage
        if: always()
        run: df -h

  linux-client:
    if: ${{ !inputs.product || inputs.product == 'all' || inputs.product == 'linux-client' }}
    needs: policy
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      PLANK_BUILD_JOBS: '4'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/ci/context.py
      - run: bash scripts/ci/install-linux-deps.sh client
      - name: Restore and verify dependencies
        if: ${{ !inputs.clean_bootstrap }}
        uses: ./.github/actions/dependency-cache
        with:
          operation: restore
          product: linux-client
      - run: bash scripts/ci/bootstrap.sh linux-client
      - name: Save dependencies
        if: ${{ !inputs.clean_bootstrap && github.event_name != 'pull_request' }}
        uses: ./.github/actions/dependency-cache
        with:
          operation: save
          product: linux-client
      - run: bash scripts/ci/build.sh linux-client
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PLANK_ARTIFACT_ROOT }}/
          if-no-files-found: error
          retention-days: 7
      - name: Report disk usage
        if: always()
        run: df -h

  macos:
    if: ${{ !inputs.signed && (!inputs.product || inputs.product == 'all' || inputs.product == 'macos-host' || inputs.product == 'macos-client') }}
    needs: policy
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(inputs.product == 'macos-host' && '["host"]' || inputs.product == 'macos-client' && '["client"]' || '["host", "client"]') }}
    env:
      PLANK_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require macOS 27 and SDK 27 on Apple Silicon
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d . -f 1)" -ge 27
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d . -f 1)" -ge 27
          command -v cmake
          command -v ninja
      - run: python3 scripts/ci/context.py
      - name: Restore and verify dependencies
        if: ${{ !inputs.clean_bootstrap }}
        uses: ./.github/actions/dependency-cache
        with:
          operation: restore
          product: macos-${{ matrix.product }}
      - run: bash scripts/ci/bootstrap.sh macos-${{ matrix.product }}
      - name: Save dependencies
        if: ${{ !inputs.clean_bootstrap && github.event_name != 'pull_request' }}
        uses: ./.github/actions/dependency-cache
        with:
          operation: save
          product: macos-${{ matrix.product }}
      - run: bash scripts/ci/build.sh macos-${{ matrix.product }}
      - name: Explain unsigned build scope
        run: echo 'Unsigned compile/test only. No distributable macOS package, signing credentials, or hardware acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report disk usage
        if: always()
        run: df -h

  macos-signed:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed && (inputs.product == 'macos-host' || inputs.product == 'macos-client' || inputs.product == 'macos-fullscreen-probe') }}
    needs: policy
    environment: macos-signing
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      PLANK_CI_PRODUCT: ${{ inputs.product }}
      PLANK_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate target and clean source
        run: |
          case "$PLANK_CI_PRODUCT" in macos-host|macos-client|macos-fullscreen-probe) ;; *) exit 2;; esac
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d . -f 1)" -ge 27
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d . -f 1)" -ge 27
          python3 scripts/ci/context.py
      - name: Restore and verify dependencies
        if: ${{ inputs.product != 'macos-fullscreen-probe' && !inputs.clean_bootstrap }}
        uses: ./.github/actions/dependency-cache
        with:
          operation: restore
          product: ${{ inputs.product }}
      - name: Bootstrap dependencies without signing credentials
        if: ${{ inputs.product != 'macos-fullscreen-probe' }}
        run: bash scripts/ci/bootstrap.sh "$PLANK_CI_PRODUCT"
      - name: Save dependencies
        if: ${{ inputs.product != 'macos-fullscreen-probe' && !inputs.clean_bootstrap }}
        uses: ./.github/actions/dependency-cache
        with:
          operation: save
          product: ${{ inputs.product }}
      - name: Build, sign, notarize and verify
        env:
          PLANK_DEVELOPER_ID_APPLICATION_P12: ${{ secrets.PLANK_DEVELOPER_ID_APPLICATION_P12 }}
          PLANK_DEVELOPER_ID_INSTALLER_P12: ${{ secrets.PLANK_DEVELOPER_ID_INSTALLER_P12 }}
          PLANK_DEVELOPER_ID_APPLICATION_PASSWORD: ${{ secrets.PLANK_DEVELOPER_ID_APPLICATION_PASSWORD }}
          PLANK_DEVELOPER_ID_INSTALLER_PASSWORD: ${{ secrets.PLANK_DEVELOPER_ID_INSTALLER_PASSWORD }}
          PLANK_APPLE_ID: ${{ secrets.PLANK_APPLE_ID }}
          PLANK_APPLE_APP_PASSWORD: ${{ secrets.PLANK_APPLE_APP_PASSWORD }}
          PLANK_MACOS_HOST_PROVISION_PROFILE: ${{ secrets.PLANK_MACOS_HOST_PROVISION_PROFILE }}
          PLANK_MACOS_TEAM_ID: ${{ vars.PLANK_MACOS_TEAM_ID }}
        run: python3 scripts/ci/sign-macos.py
      - name: Remove temporary signing material
        if: always()
        run: python3 scripts/ci/sign-macos.py --cleanup
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-${{ inputs.product }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PLANK_ARTIFACT_ROOT }}/
          if-no-files-found: error
          retention-days: 7
