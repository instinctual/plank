name: Dependency qualification

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Qualification group
        type: choice
        default: all
        options: [all, transport, vulkan]
  workflow_call:
    inputs:
      scope:
        type: string
        default: all

permissions:
  contents: read

jobs:
  transport:
    if: inputs.scope != 'vulkan'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git submodule update --init third_party/kyber-kymux
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node24
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/plank-transport/target
          key: plank-transport-tests-v1-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'protocol/plank-transport/Cargo.lock') }}-${{ hashFiles('protocol/plank-transport/src/**/*.rs', 'third_party/kyber-kymux/**/*.rs', 'third_party/quinn-proto-0.11.19/**/*.rs') }}
          restore-keys: |
            plank-transport-tests-v1-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'protocol/plank-transport/Cargo.lock') }}-
      - name: Compile transport qualification tests
        run: |
          cargo test --no-run --locked --release --manifest-path protocol/plank-transport/Cargo.toml --features quinn-telemetry
          cargo test --no-run --locked --release --manifest-path protocol/plank-transport/Cargo.toml --features quinn-telemetry,sender-timing
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node24
        if: success() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/plank-transport/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Test transport state and datagram accounting
        run: |
          cargo test --locked --release --manifest-path protocol/plank-transport/Cargo.toml --features quinn-telemetry
          cargo test --locked --release --manifest-path protocol/plank-transport/Cargo.toml --features quinn-telemetry,sender-timing
          cargo test --locked --release --manifest-path third_party/quinn-proto-0.11.19/Cargo.toml --lib connection::datagrams::
      - name: Compare delayed acknowledgments and receiver pauses
        run: bash scripts/test/run-plank-transport-stalls.sh
      - name: Test shared source-first FEC and reliable recovery
        run: PLANK_TRANSPORT_CARGO_FEATURES=quinn-telemetry bash scripts/test/run-plank-transport-native-loopback.sh

  transport-macos:
    if: inputs.scope != 'vulkan'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.7'
      RUSTFLAGS: '-C strip=none'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate native builder and sources
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d . -f 1)" -ge 27
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d . -f 1)" -ge 27
          git submodule update --init third_party/kyber-kymux
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node24
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/plank-transport/target
          key: plank-macos-transport-tests-v1-${{ hashFiles('rust-toolchain.toml', 'protocol/plank-transport/Cargo.lock') }}-${{ hashFiles('protocol/plank-transport/src/**/*.rs', 'third_party/kyber-kymux/**/*.rs', 'third_party/quinn-proto-0.11.19/**/*.rs') }}
          restore-keys: |
            plank-macos-transport-tests-v1-${{ hashFiles('rust-toolchain.toml', 'protocol/plank-transport/Cargo.lock') }}-
      - name: Build isolated native test executable
        run: |
          mkdir -p build/transport-qualification
          cargo test --no-run --locked --release --lib --manifest-path protocol/plank-transport/Cargo.toml --features quinn-telemetry,sender-timing --message-format=json > build/transport-qualification/compiler.jsonl
          python3 scripts/test/collect-transport-test.py
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node24
        if: success() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/plank-transport/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Test native Mac FEC and reliable recovery
        run: PLANK_TRANSPORT_CARGO_FEATURES=quinn-telemetry,sender-timing bash scripts/test/run-plank-transport-native-loopback.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-transport-qualification-${{ github.run_id }}
          path: build/transport-qualification/export/
          if-no-files-found: warn
          retention-days: 7

  vulkan:
    if: inputs.scope != 'transport'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned sources and compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libx11-dev libxrandr-dev libxcb1-dev libwayland-dev libxkbcommon-dev
          git submodule update --init apps/host/linux
          git -C apps/host/linux submodule update --init third-party/build-deps third-party/googletest
          git -C apps/host/linux/third-party/build-deps submodule update --init third-party/FFmpeg/Vulkan-Loader third-party/FFmpeg/Vulkan-Headers
      - run: bash scripts/test/qualify-vulkan-loader.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vulkan-allocation-qualification
          path: build/vulkan-qualification/*.log
          if-no-files-found: error
