name: Dependency qualification

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git submodule update --init third_party/kyber-kymux
      - name: Test production transport and native loss recovery
        run: |
          cargo test --locked --release --manifest-path protocol/plank-transport/Cargo.toml
          cargo test --locked --release --manifest-path third_party/quinn-proto-0.11.19/Cargo.toml --lib connection::datagrams::
          PLANK_TRANSPORT_CARGO_FEATURES=quinn-telemetry bash scripts/test/run-plank-transport-native-loopback.sh
          PLANK_TRANSPORT_CARGO_FEATURES=quinn-telemetry,macos-source-first bash scripts/test/run-plank-transport-native-loopback.sh

  vulkan:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned sources and compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libx11-dev libxrandr-dev libxcb1-dev libwayland-dev libxkbcommon-dev
          git submodule update --init apps/host/linux
          git -C apps/host/linux submodule update --init third-party/build-deps third-party/googletest
          git -C apps/host/linux/third-party/build-deps submodule update --init third-party/FFmpeg/Vulkan-Loader third-party/FFmpeg/Vulkan-Headers
      - run: bash scripts/test/qualify-vulkan-loader.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vulkan-allocation-qualification
          path: build/vulkan-qualification/*.log
          if-no-files-found: error
