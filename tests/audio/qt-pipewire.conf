# Isolated test daemon only. No physical devices, network listeners or user
# settings. A session manager connects the real renderer to this dummy sink.
context.properties = {
    default.clock.rate = 48000
    default.clock.quantum = 1024
    default.clock.min-quantum = 1024
    default.clock.max-quantum = 1024
}
context.objects = [
    { factory = adapter
      args = {
        factory.name = support.null-audio-sink
        node.name = plank-test-sink
        node.description = "PLANK isolated test output"
        media.class = Audio/Sink
        audio.position = [ FL FR ]
        object.linger = true
      }
    }
]
