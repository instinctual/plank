# Add alongside an existing Telegraf output; no InfluxDB credentials belong here.
# Match [metrics] metrics_port in /etc/plank/host.conf or client.conf.
# This service input receives PLANK's own timestamps, independent of Telegraf's
# system-metric collection interval. Bind only to IPv4 loopback.
[[inputs.socket_listener]]
  service_address = "udp4://127.0.0.1:28991"
  data_format = "influx"

# Keep the existing Telegraf host tag (omit_hostname = false). It identifies the
# machine generating these observations, not the remote workstation. Existing
# outputs.influxdb_v2 batching, token, organization and bucket remain unchanged.
