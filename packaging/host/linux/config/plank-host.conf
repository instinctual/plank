# PLANK Host configuration.
# This root-managed file is the single source of host runtime settings.

[general]
# Host name returned to clients and published through mDNS when discovery is
# enabled. When this setting is omitted, PLANK uses the operating-
# system hostname. Uncomment it only to advertise a different stable name.
# host_name = workstation-name

[network]
# Base port used by the current HTTPS launch/authentication service and native
# QUIC transport. Changing it requires matching firewall and client policy.
port = 28989

# Maximum time, in milliseconds, to wait for the client's initial media-channel
# pings or for activity from an established client. When the deadline expires,
# the host stops and cleans up that stream. Default: 10000 milliseconds.
ping_timeout = 10000

[display]
# physical = preserve connected monitors; a remote session may temporarily
# lease a bookmark-selected layout that is restored at disconnect.
# virtual = initialize one internal 1920x1080 output for headless login; the
# authenticated bookmark selects the active display count and resolutions.
startup_layout = physical

# Optional GPU/display adapter selector for a multi-GPU host. When omitted or
# left empty, PLANK automatically selects the qualified adapter.
# adapter_name =

[audio]
# Optional PipeWire/Pulse sink name to capture. When omitted or left empty,
# PLANK follows the operating system's current output sink.
# audio_sink =

[input]
# Optional comma-separated client-keycode/host-keycode replacement pairs.
# Decimal and hexadecimal values are accepted. Custom pairs supplement the
# built-in PLANK modifier mappings; omit this setting when no additional
# mapping is needed. Format: client key, host key, client key, host key, and so on.
# keybindings =
# Milliseconds before a held remote key starts repeating. Set 0 to disable the
# host-generated repeat delay/timer.
key_repeat_delay = 500

# Number of host-generated repeat events per second for a held remote key. The
# value must be greater than 0; the qualified default is approximately 24.9 Hz.
key_repeat_frequency = 24.9

[common-video]
# Minimum capture cadence while the desktop is static, from 0 through 1000 FPS.
# A value of 0 derives the cadence from half the active session's requested FPS.
minimum_fps_target = 0

[nvenc-encoder]
# NVENC quality preset from 1 (fastest) through 7 (highest quality/slowest).
nvenc_preset = 1
# NVENC multipass analysis: disabled, quarter_res, or full_res. Multipass can
# improve motion estimation and bitrate distribution but consumes more GPU work.
nvenc_twopass = quarter_res
# Spatial adaptive quantization allocates more bits to visually sensitive flat
# regions. It consumes additional CUDA work. Accepted values: true or false.
nvenc_spatial_aq = false
# Percentage added to NVENC's default one-frame VBV buffer, from 0 through 400.
# Larger values permit higher short-term bitrate peaks and increase buffering.
nvenc_vbv_increase = 0
# Split-frame encoding policy: disabled, driver_decides, or enabled. Splitting
# is useful only on GPUs with multiple NVENC hardware engines.
nvenc_split_encode = driver_decides
# Use CAVLC entropy coding for H.264 instead of the normal, more efficient CABAC.
# This setting has no effect on HEVC profiles. Accepted values: true or false.
nvenc_h264_cavlc = false

[x264-encoder]
# Minimum software-encoder worker/slice count.
min_threads = 16
# x264 speed/quality preset and latency tuning policy.
sw_preset = ultrafast
sw_tune = zerolatency
# Maximum instantaneous x264 rate as a percentage of the bookmark/session
# bitrate target. Valid range: 100 through 400 percent.
sw_vbv_maxrate_percentage = 150
# x264 VBV reservoir in average-rate frame units, from 0 through 16.
sw_vbv_buffer_frames = 4
# x264 scene-change threshold, from 0 through 100. Zero disables adaptive
# scene-change keyframes.
sw_scenecut = 40

[security]
# Root authentication is denied by default. Enabling it does not bypass the
# active-desktop ownership gate or the host's PAM/SSSD/HBAC policy.
allow_root_login = false
# When true, other Clients can see the login name of the account that owns
# the active desktop, shown as "In Session - Ernie.Armitage". Default: false.
# When false, Clients see only "In Session".
publish_session_user = false
cert = /etc/plank/tls/cert.pem
pkey = /etc/plank/tls/key.pem
file_state = /var/lib/plank/plank-state.json

[discovery]
# Publish this host on the local network through mDNS/Avahi so compatible
# clients can discover it automatically. Accepted values: true or false.
# The default is false; manually configured hostname/IP bookmarks continue to
# work when discovery is disabled. Enabling this affects advertisement only and
# requires a working mDNS/Avahi service on the host network.
mdns_discovery = false

[logging]
log_path = /var/log/plank/host.log
min_log_level = info
