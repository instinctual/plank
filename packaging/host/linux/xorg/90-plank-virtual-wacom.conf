# Only PLANK's mirrored tablet carries the udev tag below. The Wacom Xorg
# driver's pressure recalibration can suppress tip clicks when a report starts
# above zero pressure; the original pressure values remain available to apps.
Section "InputClass"
    Identifier "PLANK virtual Wacom tablet"
    MatchTag "plank-virtual-tablet"
    Option "PressureRecalibration" "off"
EndSection
