# PLANK macOS Host administrator configuration
# Installed at /etc/plank/host.conf; root-owned, readable by desktop workers.
# Restart PLANK Host (or restart the Mac) after editing. Upgrades preserve this file.
# Use unquoted values. Whole-line # and ; comments are supported. Unknown or
# duplicate keys, invalid values and unsafe file permissions stop Host startup.
# Only the settings below are supported on macOS; Linux-specific keys do not apply.

[general]
# Workstation name advertised to Clients. 1-255 UTF-8 bytes, no control characters.
# Omitted key defaults to PLANK Mac Host. This does not change the OS computer name.
host_name = PLANK Mac Host

[network]
# Shared TCP (authentication) and UDP (QUIC) port. Range 1-65535, default 28989.
# Update Client bookmarks and administrator-managed firewall rules when changing it.
# The Host always listens on all IPv4 interfaces; there is no bind-address option.
port = 28989

# Maximum QUIC connection inactivity, in milliseconds. Default: 10000 (10 seconds).
# Accepted values: whole numbers from 200 through 120000; zero/negative values do
# not disable the timeout. Invalid values stop Host startup rather than being clamped.
# QUIC traffic/keepalives keep an otherwise idle desktop connected: this is NOT a
# mouse/keyboard inactivity timer. On a dead connection the transport closes and
# the Host cleans up that stream. QUIC loss-recovery timing and the peer's timeout
# also apply, so this is not an exact wall-clock disconnection guarantee.
# Larger values tolerate longer network interruptions but delay dead-session
# cleanup; they do not add a video/audio buffer or increase streaming latency.
# Keepalives are automatic (every 1 second, or half this timeout when below 2000).
# Initial connection handshakes retain their separate 10-second deadline. This
# does not set the Client's "Unreachable host timeout" or Wait/Disconnect policy.
ping_timeout = 10000

[security]
# Publish the active desktop's short login name in public Host discovery.
# Accepted values: true or false (lowercase, unquoted). Default: false.
# false: Clients show only "In Session". true: Clients may show
# "In Session - example-user". Anyone who can reach the Host can read this name
# BEFORE authentication; enable only when that disclosure is acceptable.
# The name comes from the desktop's OS account, not the connecting Client. A
# locked desktop retains its name; logout/user switching retires that worker's
# metadata. LoginWindow never publishes a username, even during a remote stream.
# Only 1-64 ASCII letters/digits, dot, underscore and hyphen are published; a
# directory name's @realm suffix is omitted. Unsupported names remain nameless.
# Discovery uses cached metadata; enabling this adds no per-poll account lookup.
# This is advisory only: authentication, same-user access, ownership restrictions
# and the explicit remote-session takeover workflow are unchanged.
publish_session_user = false

# Resolution, capture and encoding profiles are negotiated from the Client bookmark.
# Workstation UUID and TLS identity are internal state, not administrator settings.
# They remain in /Library/Application Support/PLANK and are preserved on upgrade.
