# Allow PLANK's QUIC sockets to request up to 4 MiB of receive-buffer space.
# This is a ceiling, not the default for other applications or a playback queue.
# Memory is used as packets arrive; PLANK continues draining immediately.
# Linux reports twice the requested SO_RCVBUF value for bookkeeping overhead.
# Keep an administrator's larger setting here or in a later sysctl.d file.
# Package upgrades preserve edits; uninstall removes this on DEB purge/RPM removal.
net.core.rmem_max = 4194304
