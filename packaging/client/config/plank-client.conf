# PLANK Client administrator policy
#
# This root-owned INI file is reserved for settings that an administrator
# wants to enforce. Where a matching UI preference exists, an active key
# overrides it and disables that control. Policy-only options below have no
# user-facing toggle; an omitted key uses its documented default.

[network]
# Default TCP/UDP PLANK endpoint used when a bookmark address does not
# include an explicit port. Accepted range: 1024-65535.
port = 28989

# Enable or disable local-network mDNS discovery. Accepted values: true, false.
# The client defaults this preference to false when the key is omitted.
# mdns_discovery = false

# Show an informational Internet indicator in the Client's main window.
# This never blocks a connection or changes a bookmark's Host status. No reply
# can mean ICMP is blocked; a reply does not prove DNS, VPN or Host availability.
# Restart the Client after changing any of these settings. Default: true.
internet_check_enabled = true

# Ordered, comma-separated list of 1-8 unicast IPv4 addresses (not DNS
# names). Background rounds stop at the first reply and restart at the first
# address. The live connectivity dialog checks every address concurrently.
# An invalid/empty list disables probing and shows
# Unavailable; it does not silently substitute the public defaults below.
internet_check_hosts = 8.8.8.8, 1.1.1.1, 9.9.9.9

# Check when the main window appears and every 15 seconds (5-3600 allowed),
# without overlapping rounds. Hidden/minimized windows stop all Internet pings.
# While the connectivity dialog is open, check all addresses about once per
# second instead. Network changes and resume recheck only a visible main window.
internet_check_interval_seconds = 15

# Maximum wait for each address, in milliseconds (100-10000 allowed). A full
# failed default round takes up to about 3 seconds; the UI remains responsive.
internet_check_timeout_ms = 1000

[authentication]
# Opt in to storing the last successfully authenticated username per bookmark
# in each local user's bookmark settings. Prefills the editable username and
# focuses the password field; never saves passwords/tokens or submits a login.
# Default false. Restart the Client after changing policy. False or an omitted
# key removes saved usernames (including backup entries) on the next startup.
# Changing a bookmark's destination or deleting it also clears its saved name.
remember_username = false

[metrics]
# Optional PLANK session metrics for a LOCAL Telegraf agent. Default: false.
# Telegraf inputs.socket_listener must use udp4://127.0.0.1:28991 and
# data_format = "influx". Its existing output owns database URLs and tokens;
# never put database credentials here. PLANK sends only to IPv4 loopback.
# No Telegraf installation or remote database changes are made by PLANK.
# Ubuntu Clients also report aggregate Wacom pen movement/tip-down counts while
# session input is active. No coordinates, pressure values or strokes are logged.
metrics_enabled = false

# Local UDP destination port, 1024-65535. Match the Telegraf listener.
# No firewall opening, privileged capability or external PLANK listener needed.
metrics_port = 28991

# Sample interval in whole seconds, 1-60. Default: 1. Monotonic time is used
# for rates; each sample carries its wall-clock timestamp. Telegraf's flush
# interval controls when Grafana receives the batch, independently of sampling.
# Local delivery is best effort: a missing/busy agent never blocks streaming.
# Invalid metrics values disable metrics without failing the session. Restart
# the application/service after changes. Usernames and media/input contents
# are excluded; stable workstation/bookmark IDs and versions are included.
metrics_interval_seconds = 1
