[package]
name = "plank-transport"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
quinn-bbr = ["quinn-proto/plank-bbr-default"]
quinn-telemetry = ["kynet/quinn-telemetry"]
sender-timing = ["kynet/sender-timing", "kyproto/sender-timing"]
# Source-first FEC selection used by the macOS Host; no alternate pacing mode.
macos-source-first = ["sender-timing", "kyproto/source-first-fec"]

[dependencies]
anyhow = "1.0"
bytes = "1.10"
hex = "0.4"
kynet = { path = "../../third_party/kyber-kymux/kynet", features = ["kynet-quinn"] }
kyproto = { path = "../../third_party/kyber-kymux/kyproto" }
kymux-types = { path = "../../third_party/kyber-kymux/kymux-types" }
quinn-proto = { version = "=0.11.17", default-features = false }
ring = "0.17"
rustls = { version = "0.23.31", default-features = false, features = ["logging", "std", "tls12"] }
subtle = "2.6"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
socket2 = "0.6"

[patch.crates-io]
# Keep the same narrowly repaired Quinn release shared by production and the
# standalone probes. See third_party/quinn-proto-0.11.17/PLANK-PATCH.md.
quinn-proto = { path = "../../third_party/quinn-proto-0.11.17" }
